transform_tolerance: 0.5

footprint:
  - [-0.11, -0.08]
  - [-0.11, 0.08]
  - [0.20, 0.08]
  - [0.20, -0.08]
footprint_padding: 0.01

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 3.0
    raytrace_range: 3.5

inflation_layer:
  inflation_radius: 0.18
  cost_scaling_factor: 6.0
