# Local planner is the standalone CymPlanner plugin from the 20260713 release
# (catkin_ws/src/cym_planner).  Plugin params live in
# config/cym_planner_params.json, loaded by the move_base node in the launch
# files.  /cmd_vel may be published after a 2D Nav Goal, but this offline
# package has no base driver or hardware subscriber.
base_global_planner: global_planner/GlobalPlanner
base_local_planner: cym_planner/CymPlanner

planner_frequency: 1.0
controller_frequency: 5.0
planner_patience: 5.0
controller_patience: 5.0
oscillation_timeout: 0.0
oscillation_distance: 0.20
shutdown_costmaps: false

recovery_behavior_enabled: false
clearing_rotation_allowed: false
