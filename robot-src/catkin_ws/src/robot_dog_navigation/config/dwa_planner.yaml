# DWA 局部规划器参数（对比验证用，local_planner:=dwa 时加载）
# 参考官方 DWAPlannerROS 默认 + 实机 XGO mini3W 速度限制：
#   move_base 输出 vx 最高 0.4 m/s（桥 x 映射 0.2 m/s 满步长 25 前已放宽，
#   0.4 m/s 也映射到满步长，见 robot_dog_main.launch x_scale_ref=0.2）
DWAPlannerROS:
  max_vel_x: 0.40
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.40
  min_vel_trans: 0.05
  max_vel_theta: 0.80
  min_vel_theta: 0.10
  acc_lim_x: 0.50
  acc_lim_y: 0.0
  acc_lim_theta: 0.80

  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.15
  trans_stopped_vel: 0.05
  theta_stopped_vel: 0.10

  sim_time: 1.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.05
  vx_samples: 10
  vy_samples: 1
  vtheta_samples: 20

  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.10
  heading_lookahead: 0.325
  oscillation_reset_dist: 0.05
  restore_defaults: false
